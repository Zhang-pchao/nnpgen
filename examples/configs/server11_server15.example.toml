schema_version = "nnpgen.config.v1"

[paths]
project_root = "/path/to/project"
run_root = "/path/to/project/runs"
plan_root = "/path/to/project/plans"
poscar_pool_root = "/path/to/project/poscar_pool"

[md]
model_path = "/path/to/models/mace.model"
conda_env = "/path/to/conda/envs/mace_ase"

[dft]
vasp_root = "/path/to/remote/vasp"
vasp_smoke_root = "/path/to/remote/vasp/smoke"
vasp_run_root = "/path/to/remote/vasp/run"
incar_template = "/path/to/remote/vasp/template/incar/INCAR"
pbs_template = "/path/to/remote/vasp/template/script/vasp.pbs"
potcar_org_dir = "/path/to/remote/vasp/template/potcar/org"
potcar_cat_dir = "/path/to/remote/vasp/template/potcar/cat"

[remote]
default_host = "pbs-cluster"
