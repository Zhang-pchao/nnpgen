[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnpgen"
version = "0.2.0"
description = "Workflow toolkit for neural network potential generation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "nnpgen contributors" }
]
keywords = ["machine-learning-potentials", "molecular-dynamics", "vasp", "deepmd", "mace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
md = ["ase", "mace-torch"]
deepmd = ["deepmd-kit"]
dataset = ["numpy"]
lmdb = ["numpy", "lmdb", "msgpack"]
geo = ["ase", "numpy"]
plot = ["matplotlib", "numpy"]
dev = ["pytest", "numpy", "ase"]

[project.scripts]
nnpgen = "nnpgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nnpgen = ["templates/*.sbatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
